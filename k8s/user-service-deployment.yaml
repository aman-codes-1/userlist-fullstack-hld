apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: user-service
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: user-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: user-service
    spec:
      containers:
        - env:
            - name: ALLOWED_ORIGINS
              value: http://localhost:3002
            - name: API_GATEWAY_HOST
              value: api-gateway
            - name: API_GATEWAY_PORT
              value: "4000"
            - name: API_GATEWAY_PORT_2
              value: "4002"
            - name: APP_GATEWAY_HOST
              value: app-gateway
            - name: APP_GATEWAY_PORT
              value: "4001"
            - name: CLIENT_URL
              value: http://aab6cffa50a0b4721b2676fe1c461972-797358324.ap-south-1.elb.amazonaws.com
            - name: MONGO_URI
              value: mongodb://root:example@mongodb:27017/
            - name: SERVICE
              value: user-service
            - name: USER_SERVICE_HOST
              value: user-service
            - name: USER_SERVICE_PORT
              value: "4003"
            - name: USER_SERVICE_REDIS_HOST
              value: redis
            - name: USER_SERVICE_REDIS_PORT
              value: "6379"
          image: amancodes0/userlist-fullstack-hld-user-service
          name: user-service
          ports:
            - containerPort: 4003
              protocol: TCP
      restartPolicy: Always
